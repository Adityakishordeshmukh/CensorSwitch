<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AgentGate dashboard</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; color: #222; }
  h1 { font-weight: 500; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; margin: 24px 0; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; min-width: 160px; }
  .card .value { font-size: 28px; font-weight: 600; }
  .card .label { font-size: 13px; color: #666; }
  #refresh { margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>AgentGate dashboard</h1>
  <button id="refresh" onclick="load()">Refresh</button>
  <div class="cards" id="cards"></div>

  <script>
    async function load() {
      const res = await fetch('/api/stats');
      const s = await res.json();
      const cards = [
        { label: 'Total requests', value: s.total_requests },
        { label: 'Cache hit rate', value: (s.cache_hit_rate * 100).toFixed(1) + '%' },
        { label: 'Requests blocked', value: s.blocked_requests },
        { label: 'Cost spent', value: '$' + s.cost_spent_usd },
        { label: 'Cost saved (cache)', value: '$' + s.cost_saved_usd },
      ];
      document.getElementById('cards').innerHTML = cards.map(c =>
        `<div class="card"><div class="value">${c.value}</div><div class="label">${c.label}</div></div>`
      ).join('');
    }
    load();
  </script>
</body>
</html>
